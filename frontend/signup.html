<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | NaNb</title>

    <link rel="icon" type="image/svg+xml" href="assets/images/NaNb.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="streetwear-body auth-page">



    <div class="auth-page-backdrop">

        <div class="auth-page-shell">

            <a href="index.html" class="auth-page-home">

                <img src="assets/images/NaNb.svg" alt="NaNb" class="auth-page-logo">

                <span data-i18n="auth.backHome">Back to Home</span>

            </a>



            <div class="auth-page-card">

                <div class="auth-page-card-header">

                    <span class="auth-modal-tag" data-i18n="auth.join">Join NaNb</span>

                    <h1 class="auth-modal-title" data-i18n="auth.signup">Sign Up</h1>

                    <p class="auth-page-subtitle" data-i18n="auth.signupSubtitle">Create your account to unlock wishlist sync and secure checkout.</p>

                </div>



                <div class="auth-form-message d-none" data-auth-message></div>



                <form id="signupPageForm" class="auth-form" data-human-check novalidate>

                    <div class="mb-3">

                        <label for="signupPageName" class="form-label" data-i18n="auth.fullName">Full Name</label>

                        <input type="text" class="form-control auth-input" id="signupPageName" name="name" placeholder="Your name" data-i18n-placeholder="auth.namePlaceholder" required>

                    </div>

                    <div class="mb-3">

                        <label for="signupPageEmail" class="form-label" data-i18n="auth.email">Email</label>

                        <input type="email" class="form-control auth-input" id="signupPageEmail" name="email" placeholder="you@email.com" data-i18n-placeholder="auth.emailPlaceholder" data-validate-email required>

                        <div class="auth-field-feedback" data-i18n="contact.emailInvalid">Please enter a valid email address.</div>

                    </div>

                    <div class="mb-3">

                        <label for="signupPagePassword" class="form-label" data-i18n="auth.password">Password</label>

                        <div class="auth-password-wrap">

                            <input type="password" class="form-control auth-input" id="signupPagePassword" name="password" placeholder="Create password" data-i18n-placeholder="auth.createPassword" minlength="8" required>

                            <button type="button" class="auth-password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label for="signupPageConfirm" class="form-label" data-i18n="auth.confirmPassword">Confirm Password</label>

                        <div class="auth-password-wrap">

                            <input type="password" class="form-control auth-input" id="signupPageConfirm" name="confirmPassword" placeholder="Confirm password" data-i18n-placeholder="auth.confirmPlaceholder" required>

                            <button type="button" class="auth-password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>

                    <button type="submit" class="btn btn-hype-primary w-100 auth-submit-btn" data-i18n="auth.createAccount">Create Account</button>

                </form>



                <p class="auth-switch-text text-center mt-4 mb-0">

                    <span data-i18n="auth.haveAccount">Already have an account?</span>

                    <a href="login.html" class="auth-switch-link" data-i18n="auth.loginLink">Login</a>

                </p>

            </div>

        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/i18n.js"></script>

    <script src="assets/js/form-utils.js"></script>

    <script src="assets/js/human-check.js"></script>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/cookies.js"></script>

    <script src="assets/js/auth-modals.js"></script>

</body>

</html>
